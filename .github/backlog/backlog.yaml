        type: feature
        title: Créer et mettre à jour les genres
        story: |
          En tant que gestionnaire de la base de données des films, je veux pouvoir créer et mettre à jour les genres
          afin de maintenir une liste de genres cohérente et à jour.
        size: M
        priority: P1
        dependsOn: [DATABASE-02]
        acceptance:
          - Un module dédié permet de rechercher un genre par identifiant, de lister les genres triés par identifiant et d'insérer ou actualiser leurs libellés.
        definitionOfDone:
          - Le module dédié aux genres est implémenté.
          - Des test unitaires couvrent la recherche, l'insertion et la mise à jour des genres.
