epics:
  - id: DATABASE
    title: Dashboard des films
    objective: Mettre en place un tableau de bord pour visualiser les films, leurs genres et leurs pays de production.
    tickets:
      - id: DATABASE-01
        key: EXPL-01
        type: feature
        title: 'Spécifier le modèle de données à utiliser pour le tableau de bord'
        story: |
          En tant qu'analyste, je veux comprendre les informations disponibles dans TMDB et celles nécessaires au tableau de bord, afin de préparer leur collecte et de disposer d'une base de travail pour la modélisation.

          ### Besoin d'exploration

          Le tableau de bord doit permettre de comparer les films selon leur année de sortie sur une période configurable, par exemple 2015 à 2024. On souhaite explorer les titres, les genres, les pays de production, les notes, la popularité, les durées, les budgets et les recettes. Le tableau de bord doit pouvoir agréger et comparer ces informations par année de sortie. Il s'agit uniquement d'un échantillon représentatif des films disponibles dans TMDB. C'est le nombre de films importés qui détermine la représentativité.

          ### Parcours des sources : Discover, puis détail d'un film

          Le point de départ est l'API TMDB Discover (`GET /discover/movie`). Elle permet de rechercher des films selon leur date de sortie et fournit une liste paginée : il faut examiner les différentes pages du résultat.
          Chaque résultat donne notamment l'identifiant du film, ses titres, sa date de sortie, son résumé, ses indicateurs de votes et de popularité, ses chemins d'images et les identifiants de ses genres (`genre_ids`).

          Discover ne fournit pas toutes les informations nécessaires au tableau de bord. Pour chaque film retenu, son identifiant permet ensuite de consulter sa fiche détaillée (`GET /movie/{movie_id}`). Celle-ci apporte
          notamment la durée (`runtime`), le budget (`budget`), les recettes (`revenue`) et les pays de production (`production_countries`). Elle fournit aussi les genres avec leurs identifiants et leurs libellés, de même que les pays de production avec leurs codes et leurs noms.

          Il existe également un catalogue des genres (`GET /genre/movie/list`) qui permet de retrouver l'ensemble des genres disponibles. De la même manière, il existe un catalogue des pays de production (`GET /configuration/countries`) qui permet de retrouver les codes et les noms des pays disponibles.

          ### Comprendre les genres et les pays de production

          Un genre décrit le contenu ou le style d'un film : comédie, aventure, animation, etc. Un même film peut être à la fois une comédie et un film d'aventure. Le libellé « Comédie » peut aussi être partagé par de nombreux
          autres films ; il faut se fier au code TMDB pour reconnaître ce genre, même si son libellé change de langue.

          Le pays de production indique une participation à la production du film. Une coproduction peut faire intervenir plusieurs pays, et un pays peut participer à de nombreux films.

          Par exemple, un film fictif classé « Comédie » et « Aventure », coproduit par la France et la Belgique, doit être retrouvé lorsque l'on explore chacun de ces genres ou chacun de ces pays.

          ### Valeurs absentes, actualisation et calculs

          Les durées, budgets et recettes absents ou égaux à zéro sont considérés comme inconnus ;
          une valeur renseignée doit être strictement positive. Popularité, note et nombre de votes absents restent inconnus, sans remplacement par zéro.

          Retrouver un film déjà collecté doit permettre d'actualiser sa description, ses genres, ses pays et la date de l'observation, sans créer un doublon ni retirer les films des autres années. Ces informations doivent rester cohérentes entre elles.
        size: S
        priority: P1
        milestone: 2.0.0
        dependsOn: []
        acceptance:
          - Le **M**odèle **C**onceptuel de **D**onnées (**MCD**) est construit et contient les entités et relations nécessaires pour représenter les films, leurs genres et leurs pays de production. L'ensemble des propriétés et contraintes définies dans DATABASE-01 est pris en compte.
          - Les cardinalités et relations entre les entités reflètent correctement les règles fonctionnelles et les contraintes d'unicité définies dans DATABASE-01.
          - Le schéma relationnel traduit fidèlement le MCD et permet de stocker les films, leurs genres et leurs pays sans doublons.
          - Les contraintes d'intégrité référentielle sont correctement définies pour garantir la cohérence des relations entre les entités.
        definitionOfDone:
          - Le MCD et le schéma relationnel est finalisé et validé.
      - id: DATABASE-02
        key: EXPL-02
        type: feature
        title: Mettre en place le schéma SQLite à partir de la spécification
        story: |
          En tant que développeur, je veux traduire la spécification DATABASE-01 en
          schéma SQLite pour stocker les films, leurs genres et leurs pays sans doublons.

          Un CLI est fourni pour interagir avec la base de données SQLite. Le package `commander` est utilisé pour gérer les options et les commandes du CLI.

          Un lancement du CLI sans option crée et initialise la base de données par défaut.
          ```sh
          node src/back-end/backend-cli.ts
          ```

          Pour choisir un autre fichier SQLite :

          ```sh
          node src/back-end/backend-cli.ts --path ./data/custom-movies.sqlite
          ```

        size: M
        priority: P1
        milestone: 2.0.0
        dependsOn: [DATABASE-01]
        acceptance:
          - Le schéma SQLite reflète fidèlement le MCD défini dans DATABASE-01 et permet de stocker les films, leurs genres et leurs pays sans doublons.
          - Le schéma est instancié en typescript grâce à 'node:sqlite' et peut être manipulé via un CLI.
          - Le CLI permet d'exécuter les commandes nécessaires pour créer et gérer la base de données SQLite à partir du schéma défini.
        definitionOfDone:
          - Le schéma est instancié en typescript grâce à 'node:sqlite' et peut être manipulé via un CLI.
          - Le CLI permet d'exécuter les commandes nécessaires pour créer et gérer la base de données SQLite à partir du schéma défini.
          - La base de données peut être initialisée et manipulée via le CLI avec un chemin configurable.
